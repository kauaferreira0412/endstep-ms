spring:
  application:
    name: endstep-ms
  datasource:
    url: jdbc:postgresql://localhost:5432/endstep
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 16MB
server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain,text/css,application/javascript
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false

logging:
  level:
    com.endstep.ms: INFO

endstep:
  scryfall:
    api-base: https://api.scryfall.com
    bulk-type: default_cards
    user-agent: "endstep-ms/0.1 (contato: troque-me@example.com)"
    download-dir: ./.data/scryfall
    request-delay-ms: 100
  card-sync:
    run-on-startup: false
  auth:
    jwt-secret: ${ENDSTEP_JWT_SECRET:dev-secret-troque-isto-em-producao-0123456789abcdef}
    access-token-minutes: 30
    refresh-token-days: 30
    admin-emails:
      - kauafrreira23@gmail.com
    frontend-url: ${ENDSTEP_FRONTEND_URL:http://localhost:5174}
  admin:
    token: dev-admin-token
  translation:
    enabled: ${ENDSTEP_TRANSLATION_ENABLED:true}
    google-api-key: ${GOOGLE_TRANSLATE_API_KEY:}
    target-lang: pt-BR
    scryfall-lang: pt
  storage:
    type: ${ENDSTEP_STORAGE_TYPE:local}
    public-base-url: ${ENDSTEP_PUBLIC_BASE_URL:}
    local:
      dir: ./.data/uploads
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      public-base-url: ${R2_PUBLIC_BASE_URL:}
  cors:
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
